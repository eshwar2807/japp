# Fly.io configuration for the job pipeline dashboard.
#
# Single machine on purpose: the SQLite database, the batch queue and any
# parked browser sessions all live in one process. Scaling to two machines
# would give you two queues fighting over one volume.

app = "japp"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  JP_WEB_PORT = "8080"
  # Browser work stays on your machine, where you can see and clear challenges.
  JP_WORKER_KINDS = "tailor,discover,topup"
  JP_LOG_RETENTION_DAYS = "90"
  # Fly terminates TLS, so Secure cookies are correct here.
  JP_INSECURE_COOKIES = "false"

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale to zero: a stopped machine drops the queue and any parked run.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

# Persistent storage: database, vault key, session key, generated PDFs.
[[mounts]]
  source = "japp_data"
  destination = "/data"

[[vm]]
  # Chromium and WeasyPrint both want headroom; 512MB OOMs during a render.
  size = "shared-cpu-1x"
  memory = "1gb"
